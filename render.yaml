# Report service only. Cloud device integrations must be commissioned separately.
# This uses paid persistent compute. Review Render's quote before applying.
services:
  - type: web
    name: air-care-whatsapp
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    repo: https://github.com/Devilz13/air-care-whatsapp
    branch: main
    buildCommand: python -m unittest discover -s tests -v
    startCommand: python -m aircare.server
    autoDeployTrigger: off
    healthCheckPath: /healthz
    disk:
      name: aircare-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: AIRCARE_BIND
        value: 0.0.0.0
      - key: AIRCARE_DB
        value: /var/data/aircare.db
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: META_GRAPH_VERSION
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_TEMPLATE_NAME
        value: air_care_report
      - key: META_TEMPLATE_LANGUAGE
        value: en_US
      - key: AIRCARE_CLOUD_SOURCES_JSON
        value: '[]'
